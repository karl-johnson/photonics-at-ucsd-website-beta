# The scoring rubric: every parameter demos are scored on, in display order.
#
# This file is the single source of truth. The rubric page, the scores table on each demo page,
# the front page plot, preview panel and sortable list, and the checks on each demo's `scores:`
# are all built from it.
#
#   key          Name used under `scores:` in each demo's index.md (letters/digits, camelCase).
#                Renaming or removing a key means updating every demo, and the build tells you which.
#   name         Full name, shown on the rubric page, demo pages and plot dropdowns.
#   short        Column header in the front page list (narrow: use ­ soft hyphens to allow breaks).
#   unit         score = 0–10 scale (default), usd = dollar amount (no meter).
#   description  What the parameter measures.
#   levels       What each score means. Leave out scores that have no description.

parameters:
  - key: budget
    name: Budget
    short: Budget
    unit: usd
    description: The approximate cost of everything the demo needs, in US dollars.
    levels:
      0: "Free: can be done in its entirety by someone without a bank account. Baseline assumption is an internet connection."

  - key: tools
    name: Required tools
    short: Tools
    description: How fancy the tools are that you need to fabricate the required parts and/or assemble them together.
    levels:
      0: No tools required.
      1: Common everyday household or office items. Scissors, tape, microwave, etc.
      2: Common garage tools. Hand screwdriver, pliers, allen wrenches, etc.
      3: FDM 3D printer, hand drill, etc.
      4: Drill press, metal tapping, soldering iron
      5: Wood/acrylic laser cutter
      6: Manual machining
      7: Resin 3D printer, CNC machining/routing of wood/plastic
      8: Metal laser cutter, CNC machining of metal
      10: "EDM, diamond turning, cleanroom processing (lithography/deposition/etch). Essentially, inaccessible unless you’ve got connections"

  - key: manufacturingDifficulty
    name: Manufacturing difficulty
    short: "Manu­facturing"
    description: >-
      Assuming you have all the required tools, how hard it is to make and/or assemble the required
      parts. Meant to convey the care or craftsmanship required, which is related to the complexity of the parts. Note that the difficulty of any optical alignment is excluded from this category. 
    levels:
      0: Purchased off-the-shelf in an already fully assembled state.
      2: "Like a simple lego set, just put the pieces together."
      3: "Basic assembly of things on an optical breadboard (screwing stuff together). See also: assembling IKEA furniture."
      4: First level where your choices can impact the quality of the parts. E.g., 3D printing and laser cutting simple parts is mostly up to the machine, but it is up to you as the user to put the right settings into that machine.
      5: Some skill is required to obtain a nice part. E.g, putting heat-set inserts or magnets into a 3D print.
      6: A higher level of skill/knowledge is required to obtain a nice result. Tapping holes in metal, machining flat and square faces using a manual mill. 
      8: There is some aspect of the manufacturing that you are unlikely to get right on your first try and should practice on one or multiple test pieces. E.g., tempering chocolate, manually routing out precise pockets in wood using a router.
      10: Master artisan levels of hands-on skill. E.g., creating a mechanical wristwatch by hand.

  - key: alignmentDifficulty
    name: Alignment difficulty
    short: Alignment
    description: >-
      How hard it is to align the optics in the setup. This can range widely depending on available hardware available.
      Difficulty of optical alignment is highly dependent on knowledge of alignment tricks and past experience, but we try not to factor those into this rating.
      The rating is based off of the alignment procedure we recommend on that specific demo's page using the recommended optomechanical hardware.
      Becuase there are many ways that an alignment can be hard, many of the points below are described solely with examples.
    levels:
      0: No optical alignment required.
      1: Focusing a camera lens (which has a nice focus ring).
      2: Center a laser beam on a target using a tip/tilt mirror.
      4: Center a laser on two pinholes in series using two tip/tilt mirrors. Super sensitive XY/focus alignments (Schlieren).
      5: Align a Michelson interferometer with a good (long coherence length) laser source.
      6: >-
        Aligning a HeNe laser cavity where you have a second laser available to use to assist in alignment.
      7: >-
        Aligning a white light Michelson interferometer that uses a cube beamsplitter, if you have a translation stage. Any alignment which requires mode matching to single mode beams to eachother (e.g. aligning two single mode fiber collimators to eachother with high efficiency).
      8: >-
        White light Mach–Zehnder interferometer with wedge beamsplitters + compensation plates. Free space ring resonators.
      9: >-
        Free space mode locked laser. Or, anything where multiple resonators must be simultaneously aligned to some common reference/each other.
      10: Literally LIGO

  - key: portability
    name: Portability
    short: "Porta­bility"
    description: >-
      How portable the setup is. Unlike the other scales, a higher number here usually goes with a
      simpler setup, as the least portable things get a 0. The items here are just examples which mostly refer to optical setups.
      Some demos get their portability scores bumped down for special transport considerations (can't be turned upside down, temperature sensitive, light sensitive, spill risk, etc.)
    levels:
      0: >-
        Permanent installation with substantial complications in relocating. Example: an optical
        setup with dozens of components built directly on a full-size optical table that requires
        water/air from the building
      1: The setup can only barely be transported, likely requiring a special vehicle and causing lots of headache.
      2: >-
        Size of the demo is a factor when choosing a vehicle for transportation. For example, if the demo is built on a thick, heavy breadboard, or has fragile exposed optics that need large keep-out areas around them.
      3: Built on a table/breadboard too large to be put inside a bag, with lots of exposed optics on the breadboard you don't want to move/pack for transport.
      5: >-
        A bit chunky to put in a backpack, but not too fragile. Demo is such that disassembly for
        travel and light padding of some components is a possibility.
      7: "If disassembled, could easily be carried in a backpack/bag without issue."
      9: "Even without disassembly, could be carried in a backpack/bag without issue."
      10: "Could be carried around every day in your pocket (examples: hologram business card, pocket polarizers)"

  - key: setupTime
    name: Setup time
    short: Setup time
    description: >-
      Related to but distinct from portability (often correlated). A non-optics example: a fold-up
      origami kayak is quite portable but takes a while to set up, while a rigid kayak isn’t very
      portable but is pretty much ready to go once you’ve lugged it to your destination. Times are
      conservative, counted once everything is already at the location.
    levels:
      0: >-
        The objects making up the demo can only exist in one configuration, so they’re ready to go
        merely by possessing them (examples: hologram business card, pocket polarizers)
      1: Some assembly needed, but only takes a few seconds if you know what you’re doing
      2: 1 minute
      3: Under 5 minutes
      4: About 10 minutes
      5: 15 minutes of dedicated setup
      8: >-
        1 hour: even if this were the only demo at an event, budget a full hour of setup time after
        the equipment is at the location
      10: >-
        Preparations begin at the site of the demonstration a day or more in advance. Example
        (non-optics): an FRC competition must begin setting up the field at the venue over a day
        before the first practice matches

  - key: presentationComplexity
    name: Presentation complexity
    short: "Presen­tation"
    description: >-
      [TODO phrase more like: this is typical range of audiences most likely to resonate with the actual act of presenting your demo. Can span a wide range.]
      How complicated the actual process of presenting this demo is, in terms of the audience.
      Related to but distinct from concept complexity: a hologram is very easy to show to someone,
      and anyone used to normal photographs may find it interesting, while a complex optical setup
      needs a much more engaged and experienced audience to fully appreciate it.
    levels:
      0: >-
        The logical progression of the demo can be followed by any human. Example: peek-a-boo
        demonstrates that one’s hands are opaque objects that block light
      1: Kindergarten
      3: Middle school
      4: Early high school
      5: Late high school
      6: General undergraduate
      8: Physics or optics degree undergraduate
      9: Physics or optics degree graduate student
      10: Expert in this specific subfield/niche topic

  - key: conceptComplexity
    name: Concept complexity
    short: Concept complexity
    description: >-
      [TODO phrase more like: this is when someone would normally learn this topic in school. But we can teach advanced concepts to anyone!] 
      A dangerous category to rigorously define: discussions of even seemingly mundane things can
      devolve into extreme complexity depending on the people involved, and a very good teacher can
      present extremely complicated things as very simple. Both have their limits, though, and it’s
      still meaningful to define a “typical” or “most fun” range for a given project.
    levels:
      0: The underlying optical principles are obvious to every human
      1: Kindergarten
      3: Middle school
      5: Algebraic physics
      6: AP physics (calculus)
      7: Undergrad physics (lower division)
      8: Undergraduate optics
      9: Graduate optics
      10: >-
        Cutting edge research project

  - key: wow
    name: WOW factor
    short: WOW factor
    description: >-
      A subjective rating of how engaged people seem to be. It can only be assessed as high if the
      demo has been very successful at several events with different types of audiences (within the
      ranges of the previous two parameters).
    levels:
      0: >-
        People outside of those who built it have zero interest. A sad end of the scale that
        hopefully doesn’t happen for any project, but still worth representing: some projects are
        worth doing for the benefit of the people building them alone.
      2: People look at it and understand why someone might find it cool, but don’t really feel anything themselves
      5: "Threshold: if at a booth, a decent few people stop and check it out. Example: spinning polarizer"
      8: >-
        Captivates nearly all attendees who see it and leaves a lasting impression, plus has a
        fundamentally hands-on component that further enhances the experience. Example: laser puzzle
      9: Such an extraordinarily impressive demo that it gets media attention
      10: >-
        Attendees fall to their knees and shed tears, so overcome by emotion they tear at their
        clothes in despair: they have witnessed the peak sight of their mortal existence, and the rest
        of their life will be but a series of pointless moments that pale in comparison
